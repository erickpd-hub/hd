name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Fresh Android Scaffolding
        working-directory: ./mobile_chat_app
        run: |
          rm -rf android
          flutter create . --org com.empresa --project-name portal_usuario_chat --platforms android
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml
          cp -r assets/res/* android/app/src/main/res/
          flutter pub get

      - name: Build APK Release
        working-directory: ./mobile_chat_app
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-usuario-chat-release
          path: mobile_chat_app/build/app/outputs/flutter-apk/app-release.apk
